<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sample illustration: teeth after porcelain veneers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e3da"/><stop offset="1" stop-color="#e2cdc1"/></linearGradient>
    <clipPath id="m"><path d="M50 140 Q200 50 350 140 Q200 240 50 140Z"/></clipPath>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <path d="M30 140 Q200 30 370 140 Q200 265 30 140Z" fill="#c4727a"/>
  <path d="M50 140 Q200 50 350 140 Q200 240 50 140Z" fill="#4a2326"/>
  <g clip-path="url(#m)" stroke="#e4e4de" stroke-width="1">
    <!-- lower teeth -->
    <rect x="118" y="168" width="32" height="40" rx="8" fill="#f4f4ef"/>
    <rect x="152" y="168" width="32" height="40" rx="8" fill="#f8f8f4"/>
    <rect x="186" y="168" width="32" height="40" rx="8" fill="#f8f8f4"/>
    <rect x="220" y="168" width="32" height="40" rx="8" fill="#f4f4ef"/>
    <!-- upper teeth: even, symmetrical, bright -->
    <rect x="100" y="70" width="31" height="74" rx="10" fill="#fbfbf8"/>
    <rect x="132" y="70" width="32" height="82" rx="10" fill="#fdfdfb"/>
    <rect x="165" y="70" width="34" height="90" rx="11" fill="#ffffff"/>
    <rect x="201" y="70" width="34" height="90" rx="11" fill="#ffffff"/>
    <rect x="236" y="70" width="32" height="82" rx="10" fill="#fdfdfb"/>
    <rect x="269" y="70" width="31" height="74" rx="10" fill="#fbfbf8"/>
  </g>
  <text x="200" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="rgba(0,0,0,0.35)">SAMPLE IMAGE</text>
</svg>
